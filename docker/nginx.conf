server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Redirecciones relativas: conservan el dominio y el protocolo del proxy de Easypanel
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; }

    # ---- URLs antiguas (301) -------------------------------------------
    location = /index.html     { return 301 /; }
    location = /index          { return 301 /; }
    location = /Nosotros.html  { return 301 /nosotros; }
    location = /Experiencia.html { return 301 /experiencia; }
    location = /Charlas.html   { return 301 /charlas; }
    location = /Educacion.html { return 301 /educacion; }
    location = /Alianzas.html  { return 301 /alianzas; }
    location = /Imagenes.html  { return 301 /charlas; }
    location = /Blog.html      { return 301 /blog; }
    location = "/Blog Post.html" {
        if ($arg_post ~ "^[a-z0-9-]+$") { return 301 /blog/$arg_post; }
        return 301 /blog;
    }

    # Cualquier otra URL terminada en .html -> versión limpia
    location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }

    # ---- Recursos estáticos --------------------------------------------
    # CSS/JS llevan ?v=<hash> en el HTML: se pueden cachear un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* ^/(favicon\.ico|favicon\.png|robots\.txt)$ {
        expires 30d;
        try_files $uri =404;
    }

    # ---- Páginas: /alianzas sirve alianzas.html -------------------------
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri.html $uri =404;
    }
}
