<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #2a1d10;
      overflow-x: hidden;
      background-color: #b89060;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("images/bg-terrazzo.svg") center/cover no-repeat fixed;
      will-change: transform;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,238,210,0.18), transparent 55%);
    }
    .mobile-menu-btn { display: none; }
    .mobile-overlay { display: none; }
    @media (max-width: 768px) {
      .mobile-menu-btn { display: flex !important; }
      header nav {
        position: fixed; top: 0; right: -100%; width: 280px; height: 100vh;
        flex-direction: column; align-items: flex-start; gap: 0 !important;
        background: #f0e8d8; padding: 80px 32px 40px !important; z-index: 200;
        box-shadow: -8px 0 32px rgba(0,0,0,0.15);
        transition: right 0.35s cubic-bezier(.4,0,.2,1);
      }
      header nav.is-open { right: 0; }
      header nav a {
        display: block !important; font-size: 18px !important; padding: 14px 0 !important;
        border-bottom: 1px solid rgba(42,29,16,0.08) !important; width: 100%;
      }
      .mobile-overlay { display: block !important; }
      .mobile-overlay.is-open { opacity: 1; pointer-events: auto; }
      header > div { padding: 8px 16px !important; }
      header img { height: 44px !important; }
      section { padding-left: 16px !important; padding-right: 16px !important; }
      h1 { font-size: 36px !important; }
      footer > div > div:first-child { flex-direction: column !important; gap: 12px !important; }
      footer > div > div:nth-child(2) { flex-direction: column !important; gap: 10px !important; align-items: center !important; }
    }
  </style>
</helmet>

<!-- HEADER -->
<header style="position: sticky; top: 0; left: 0; right: 0; z-index: 100; background: #f0e8d8; border-bottom: 1px solid rgba(122,90,52,0.18);">
  <div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;">
    <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
      <img src="images/logo.jpeg" alt="Sueño Andino" style="height: 64px; width: auto; object-fit: contain; mix-blend-mode: multiply;">
    </a>
    <button class="mobile-menu-btn" onClick="{{ toggleMenu }}" style="display: none; align-items: center; justify-content: center; width: 44px; height: 44px; background: none; border: none; cursor: pointer; color: #2a1d10; z-index: 201;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
    </button>
    <div class="mobile-overlay {{ overlayClass }}" onClick="{{ closeMenu }}" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.3s;"></div>
    <nav class="{{ navClass }}" style="display: flex; align-items: center; gap: 36px;">
      <a href="index.html" style="text-decoration: none; color: #3b2a1a; font-size: 15px; font-weight: 500;">Inicio</a>
      <a href="Nosotros.html" style="text-decoration: none; color: #3b2a1a; font-size: 15px; font-weight: 500;">Nosotros</a>
      <a href="#" style="text-decoration: none; color: #3b2a1a; font-size: 15px; font-weight: 500; border-bottom: 2px solid #3b2a1a; padding-bottom: 2px;">Imagenes</a>
      <a href="Blog.html" style="text-decoration: none; color: #3b2a1a; font-size: 15px; font-weight: 500;">Blog</a>
    </nav>
  </div>
</header>

<!-- TITLE -->
<section style="padding: 80px 24px 48px;">
  <div style="max-width: 1100px; margin: 0 auto; text-align: center;">
    <p style="font-size: 12px; font-weight: 600; color: #357C65; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 18px;">— Galería —</p>
    <h1 style="font-family: 'Instrument Serif', serif; font-size: clamp(42px, 5.5vw, 68px); font-weight: 400; color: #2a1d10; margin-bottom: 20px; letter-spacing: -0.015em; line-height: 1.05;">Fotos <span style="font-style: italic;">Sueño Andino</span></h1>
    <a href="https://www.instagram.com/ongsuenoandino/" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: #2a1d10; font-size: 15px; font-weight: 500; padding: 10px 22px; background: rgba(244,235,217,0.6); border: 1px solid rgba(122,90,52,0.2); border-radius: 999px; backdrop-filter: blur(6px);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="5" stroke="#2a1d10" stroke-width="1.8"></rect><circle cx="12" cy="12" r="5" stroke="#2a1d10" stroke-width="1.8"></circle><circle cx="17.5" cy="6.5" r="1.2" fill="#2a1d10"></circle></svg>
      @ongsuenoandino
    </a>
  </div>
</section>

<!-- INSTAGRAM FEED -->
<section style="padding: 0 24px 100px;">
  <div style="max-width: 900px; margin: 0 auto;">
    <!-- Warm-framed embed container -->
    <div style="position: relative; border-radius: 24px; overflow: hidden; box-shadow: 0 24px 56px -16px rgba(40,25,10,0.35), 0 0 0 1px rgba(122,90,52,0.15); background: rgba(244,235,217,0.5); padding: 4px;">
      <div style="border-radius: 20px; overflow: hidden;">
        <iframe src="https://www.instagram.com/ongsuenoandino/embed" style="width: 100%; height: 1680px; border: none; display: block; clip-path: inset(0 0 900px 0); margin-bottom: -900px;" scrolling="no" allowtransparency="true"></iframe>
      </div>
    </div>

    <!-- Follow button -->
    <div style="text-align: center; margin-top: 56px;">
      <a href="https://www.instagram.com/ongsuenoandino/" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 10px; padding: 16px 40px; background: #2a1d10; color: #f4ebd9; text-decoration: none; font-size: 15px; font-weight: 600; border-radius: 999px; box-shadow: 0 12px 30px -8px rgba(40,25,10,0.5); transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 18px 38px -10px rgba(40,25,10,0.55)'" onmouseout="this.style.transform='';this.style.boxShadow='0 12px 30px -8px rgba(40,25,10,0.5)'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.8"></rect><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"></circle><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"></circle></svg>
        Síguenos en Instagram
      </a>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer style="background: #1c1409; padding: 48px 24px 32px;">
  <div style="max-width: 1100px; margin: 0 auto;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 32px; margin-bottom: 32px;">
      <p style="font-size: 15px; font-weight: 600; color: #ffffff;">Contacto</p>
      <a href="mailto:contacto@sueñoandino.org" style="font-size: 14px; color: rgba(255,255,255,0.85); text-decoration: underline;">contacto@sueñoandino.org</a>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 40px; margin-bottom: 24px;">
      <a href="#" style="font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: underline;">Terminos y condiciones</a>
      <a href="#" style="font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: underline;">Politicas de cookies</a>
      <a href="#" style="font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: underline;">Politicas de privacidad</a>
    </div>
    <p style="font-size: 13px; color: rgba(255,255,255,0.5); text-align: center;">© 2025. All rights reserved.</p>
  </div>
</footer>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    return {
      navClass: this.state.menuOpen ? 'is-open' : '',
      overlayClass: this.state.menuOpen ? 'is-open' : '',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
